name: linguasphere

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    env_file:
      - "../.env"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: always

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: 
      - ../.env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: