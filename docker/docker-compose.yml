name: linguasphere

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      -"5000:5000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    environment:
      - MONGO_URL=${MONGODB_URI}

  frontend: 
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
