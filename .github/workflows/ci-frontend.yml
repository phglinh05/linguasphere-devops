name: CI Frontend

on:
 pull_request:
   branches: [develop, main]
   paths:
     - "frontend/**"
     - "docker/docker-compose.yml"
     - ".github/workflows/ci-frontend.yml"
     - ".github/workflows/cd-gitops.yml"

 push:
   branches: [develop, main]
   paths:
     - "frontend/**"
     - "docker/docker-compose.yml"
     - ".github/workflows/ci-frontend.yml"
     - ".github/workflows/cd-gitops.yml"

permissions:
 contents: read

env:
 IMAGE_TAG: ${{ github.sha }}
 IMAGE_NAME: devopsnhom9/linguasphere-frontend

jobs:
 test:
   name: Test Frontend
   runs-on: ubuntu-latest

   steps:
     - name: Checkout source
       uses: actions/checkout@v4

     - name: Validate frontend files
       run: |
         test -d frontend
         test -f frontend/Dockerfile
         find frontend -type f | head -30

     - name: Run npm test if package exists
       run: |
         if [ -f frontend/package.json ]; then
           cd frontend
           npm ci
           npm test --if-present
         else
           echo "Static frontend: no package.json, skip npm test."
         fi

 scan_source:
   name: Scan Frontend Source
   runs-on: ubuntu-latest
   needs: test

   steps:
     - name: Checkout source
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: SonarQube/SonarCloud scan
       continue-on-error: true
       uses: SonarSource/sonarqube-scan-action@v8
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         SONAR_HOST_URL: https://sonarcloud.io
       with:
         projectBaseDir: .
         args: >
           -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
           -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
           -Dsonar.sources=frontend
           -Dsonar.exclusions=**/node_modules/**

 build_image:
   name: Build Frontend Image
   runs-on: ubuntu-latest
   needs: [test, scan_source]

   steps:
     - name: Checkout source
       uses: actions/checkout@v4

     - name: Setup Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Build frontend image locally with cache
       uses: docker/build-push-action@v6
       with:
         context: ./frontend
         load: true
         push: false
         tags: |
           ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
           ${{ env.IMAGE_NAME }}:latest
         cache-from: type=gha,scope=frontend
         cache-to: type=gha,mode=max,scope=frontend

 scan_image:
   name: Scan Frontend Image
   runs-on: ubuntu-latest
   needs: build_image

   steps:
     - name: Checkout source
       uses: actions/checkout@v4

     - name: Install Grype
       run: |
         curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh
         sudo mv ./bin/grype /usr/local/bin/grype

     - name: Scan frontend image and fail on high
       continue-on-error: true
       run: |
         grype -c .grype.yaml docker:${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --fail-on high

 push_image:
   name: Push Frontend Image
   runs-on: ubuntu-latest
   needs: scan_image
   if: github.event_name == 'push'

   steps:
     - name: Checkout source
       uses: actions/checkout@v4

     - name: Setup Docker Buildx
       uses: docker/setup-buildx-action@v3

     - name: Login to DockerHub
       uses: docker/login-action@v3
       with:
         username: devopsnhom9
         password: ${{ secrets.DOCKERHUB_TOKEN }}

     - name: Build and push frontend image
       uses: docker/build-push-action@v6
       with:
         context: ./frontend
         push: true
         tags: |
           ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
           ${{ env.IMAGE_NAME }}:latest
         cache-from: type=gha,scope=frontend
         cache-to: type=gha,mode=max,scope=frontend

 update_gitops:
   name: Update GitOps Frontend
   needs: push_image
   if: github.event_name == 'push'
   uses: ./.github/workflows/cd-gitops.yml
   with:
     service: frontend
     image_tag: ${{ github.sha }}
   secrets: inherit
