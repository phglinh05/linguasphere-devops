name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          pwd
          ls -la
          echo "=== backend ==="
          ls -la backend || true
          echo "=== frontend ==="
          ls -la frontend || true
          echo "=== docker ==="
          ls -la docker || true

      - name: Validate docker-compose file exists
        run: |
          test -f docker/docker-compose.yml
          echo "docker/docker-compose.yml found."