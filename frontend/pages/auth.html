<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> 
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="container-fluid vh-100">
        <div class="row vh-100">
            <div class="col-md-6 img-section h-100 p-0">
                <div class="img-box">
                    <div class="overlay">
                        <h2>Welcome Back</h2>
                        <p>Learning today, leading tomorrow</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 d-flex align-items-center justify-content-center">
                <div class="form-box">
                    <p class="text-center mb-5">Welcome to LinguaSphere...</p>

                    <div class="switch-btn mb-5">
                        <button class="active" id="loginBtn">Login</button>
                        <button id="registerBtn">Register</button>
                    </div>

                    <p class="text-muted mb-4 text-center">
                         Sign in to continue learning and manage your account easily.
                    </p>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" placeholder="Enter your username">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" placeholder="Enter your password">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 remember-forget">
                            <div>
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember"> Remember me
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login w-100">Login</button>

                        <div id="loginMessage" class="mt-3 text-center"></div>
                    </form>

                    <form id="registerForm" style="display: none;">
                        <div class="mb-4">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" placeholder="Enter your username">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirmpassword" class="form-control" placeholder="Confirm your password">
                        </div>
                        <button type="submit" class="btn btn-login w-100">Register</button>

                        <div id="registerMessage" class="mt-3 text-center"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
