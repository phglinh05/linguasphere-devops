server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Pages
  location = / {
    try_files /pages/auth.html =404;
  }

  location = /dashboard {
    try_files /pages/dashboard.html =404;
  }

  # Static assets
  location /assets/ {
    try_files $uri =404;
  }

  # Proxy API to backend service (docker-compose service name: backend)
  location /api/ {
    proxy_pass http://backend:${PORT};
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}