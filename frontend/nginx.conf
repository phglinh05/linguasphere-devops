server {
  listen 80;
  server_name _;

  # Serve toàn bộ frontend folder
  root /usr/share/nginx/html;

  # Khi vào / sẽ mở blog page
  index pages/blog-page.html;

  location / {
    try_files $uri $uri/ /pages/blog-page.html;
  }

  # Cache assets (optional)
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}